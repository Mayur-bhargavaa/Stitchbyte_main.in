name: Deploy Stitchbyte

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Upload Build Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: ".next,public,package.json,package-lock.json,next.config.ts,next.config.js"
          target: "/home/ubuntu/apps/stitchbyte"

      - name: Restart Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/apps/stitchbyte

            npm ci --omit=dev

            pm2 restart stitchbyte || pm2 start npm --name stitchbyte -- start

            pm2 save
