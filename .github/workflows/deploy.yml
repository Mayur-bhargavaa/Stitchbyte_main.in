name: Deploy Stitchbyte

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOG_DATABASE_URL: ${{ secrets.BLOG_DATABASE_URL }}

          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
        run: npm run build

      - name: Upload Build Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          overwrite: true
          source: ".next,public,package.json,package-lock.json,next.config.js,next.config.ts"
          target: "/home/ubuntu/apps/stitchbyte"

      - name: Deploy On Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd ~/apps/stitchbyte

            npm ci --omit=dev

            pm2 restart stitchbyte || pm2 start npm --name stitchbyte -- start

            pm2 save

            pm2 status
