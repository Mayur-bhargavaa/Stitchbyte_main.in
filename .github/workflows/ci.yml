name: StitchByte CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Check Types (TypeScript)
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Verification
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: "mongodb+srv://dummy:dummy@cluster.mongodb.net/dummy"
          BLOG_DATABASE_URL: "mongodb+srv://dummy:dummy@cluster.mongodb.net/dummy"
          NEXTAUTH_SECRET: "dummy_secret_for_ci_build"
          NEXTAUTH_URL: "http://localhost:3000"
          APP_URL: "http://localhost:3000"
          ADMIN_API_URL: "http://localhost:3001"
          CLOUDINARY_CLOUD_NAME: "dummy_cloud"
          CLOUDINARY_API_KEY: "12345"
          CLOUDINARY_API_SECRET: "dummy_secret"
          AUTH_TRUST_HOST: "true"
          # No real database in CI: strict loaders return empty instead of failing the build check
          CI_NO_DB: "1"
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOG_DATABASE_URL: ${{ secrets.BLOG_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
          # NEXT_PUBLIC_* values are baked into the build JS bundles, so they MUST be set here
          NEXT_PUBLIC_FB_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FB_PIXEL_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          LEAD_NOTIFY_TO: ${{ secrets.LEAD_NOTIFY_TO }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          META_CAPI_TEST_CODE: ${{ secrets.META_CAPI_TEST_CODE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
        run: npm run build

      - name: Generate Production .env File
        run: |
          cat << 'EOF' > .env.production
          NODE_ENV=production
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          BLOG_DATABASE_URL="${{ secrets.BLOG_DATABASE_URL }}"
          NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
          NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}"
          APP_URL="${{ secrets.APP_URL }}"
          ADMIN_API_URL="${{ secrets.ADMIN_API_URL }}"
          CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}"
          CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}"
          AUTH_TRUST_HOST="${{ secrets.AUTH_TRUST_HOST }}"
          NEXT_PUBLIC_FB_PIXEL_ID="${{ secrets.NEXT_PUBLIC_FB_PIXEL_ID }}"
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION="${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}"
          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          SMTP_HOST="${{ secrets.SMTP_HOST }}"
          SMTP_PORT="${{ secrets.SMTP_PORT }}"
          SMTP_USER="${{ secrets.SMTP_USER }}"
          SMTP_PASS="${{ secrets.SMTP_PASS }}"
          SMTP_FROM="${{ secrets.SMTP_FROM }}"
          LEAD_NOTIFY_TO="${{ secrets.LEAD_NOTIFY_TO }}"
          META_CAPI_ACCESS_TOKEN="${{ secrets.META_CAPI_ACCESS_TOKEN }}"
          META_CAPI_TEST_CODE="${{ secrets.META_CAPI_TEST_CODE }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          SETTINGS_ENCRYPTION_KEY="${{ secrets.SETTINGS_ENCRYPTION_KEY }}"
          EOF
          cp .env.production .env

      - name: Upload Build Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          overwrite: true
          source: ".env,.env.production,.next,public,package.json,package-lock.json,next.config.js,next.config.ts,prisma"
          target: "/home/ubuntu/apps/stitchbyte"

      - name: Deploy On Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd ~/apps/stitchbyte

            export NODE_OPTIONS="--max-old-space-size=768"

            npm ci --omit=dev

            npx prisma generate || true

            # Kill any orphaned process lingering on port 3000
            fuser -k 3000/tcp || true

            # Clean PM2 process recreation to pick up fresh environment and prevent zombie locks
            pm2 delete stitchbyte || true
            pm2 start npm --name stitchbyte --update-env -- start

            pm2 save
            sleep 4
            pm2 status
            pm2 logs stitchbyte --lines 20 --nostream
